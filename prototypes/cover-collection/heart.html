pointer(e,down,began){const r=this.canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;this.p.x=x;this.p.y=y;this.p.inside=true;this.p.down=down;if(began){this.previous=null;this.waves.push({x,y,start:this.time,strength:1});this.element.classList.add('touched')}if(down&&mode==='erase')this.erase(x,y)}
erase(x,y){if(this.finishAt!==null||this.complete)return;const prev=this.previous||{x,y},distance=Math.hypot(x-prev.x,y-prev.y);this.mc.strokeStyle='#fff';this.mc.fillStyle='#fff';this.mc.lineWidth=43;this.mc.lineCap='round';this.mc.lineJoin='round';this.mc.beginPath();this.mc.moveTo(prev.x,prev.y);this.mc.lineTo(x,y);this.mc.stroke();this.mc.beginPath();this.mc.arc(x,y,21.5,0,TAU);this.mc.fill();const before=this.erased,n=Math.max(1,Math.ceil(distance/6));for(let j=0;j<=n;j++){const px=lerp(prev.x,x,j/n),py=lerp(prev.y,y,j/n);const x0=clamp(Math.floor((px-22)/W*60),0,60),x1=clamp(Math.ceil((px+22)/W*60),0,60),y0=clamp(Math.floor((py-22)/H*77),0,77),y1=clamp(Math.ceil((py+22)/H*77),0,77);for(let cy=y0;cy<y1;cy++)for(let cx=x0;cx<x1;cx++){const index=cy*60+cx;if(!this.coverage[index]&&Math.hypot((cx+.5)/60*W-px,(cy+.5)/77*H-py)<21.5){this.coverage[index]=1;this.erased++}}}for(const h of this.hearts)if(!h.dead&&!h.burning&&Math.hypot(h.x-x,h.y-y)<h.size*.18+16){h.burning=true;this.emit(h.x,h.y,reduced?2:9)}this.progress=this.erased/this.coverage.length;this.previous={x,y};if(this.erased>before&&this.time-this.lastPart>.035){this.emit(x,y,reduced?1:3);this.lastPart=this.time}if(this.progress>=.6){this.finishAt=this.time;this.p.down=false;this.previous=null;for(const h of this.hearts){h.endX=h.x;h.endY=h.y}this.emit(x,y,reduced?3:18)}}
emit(x,y,count){if(this.id==='plain')return;for(let i=0;i<count;i++){const a=Math.random()*TAU,speed=15+Math.random()*48;this.parts.push({x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed-(this.id==='fire'?40:18),age:0,life:.35+Math.random()*.4,size:this.id==='heart'?2+Math.random()*2:1.5+Math.random()*2.5,angle:Math.random()*TAU,spin:(Math.random()-.5)*8})}this.parts=this.parts.slice(-90)}
update(dt){this.time+=dt;if(this.finishAt===null&&(!paused||this.p.inside||this.demo))stepHearts(this,dt);if(!paused&&!reduced)this.artTime+=dt;this.p.press=lerp(this.p.press,this.p.down?1:this.p.inside?.2:0,1-Math.exp(-dt*10));if(this.demo&&!this.complete&&this.finishAt===null){const elapsed=this.time-this.demo.start;let row=Math.floor(elapsed/.56),u=elapsed/.56-row;if(row<9){let x=row%2?338-u*316:22+u*316,y=28+row*49;this.p.x=x;this.p.y=y;this.p.inside=true;this.p.down=true;this.erase(x,y)}else{this.p.down=false;this.demo=null}}for(const p of this.parts){p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.exp(-dt*1.5);p.vy+=(this.id==='fire'?-12:this.id==='heart'?-5:80)*dt;p.angle+=p.spin*dt}this.parts=this.parts.filter(p=>p.age<p.life);if(this.finishAt!==null&&this.time-this.finishAt>.6){this.complete=true;this.parts=[];this.demo=null;this.p.down=false}}
render(){const c=this.ctx;c.clearRect(0,0,W,H);photoArt(c);if(!this.complete){const f=this.fc;f.clearRect(0,0,W,H);f.save();drawFilm(f,this);f.restore();if(this.id!=='plain'&&this.element.classList.contains('touched')){const e=this.ec;e.clearRect(0,0,W,H);e.save();e.shadowColor=this.theme.edge;e.shadowBlur=this.id==='fire'?14:5;e.drawImage(this.mask,0,0,W,H);e.globalCompositeOperation='source-in';e.fillStyle=this.theme.edge;e.fillRect(0,0,W,H);e.restore();f.save();f.globalAlpha=this.id==='fire'?.9:.25;f.drawImage(this.edge,0,0,W,H);f.restore()}f.save();f.globalCompositeOperation='destination-out';f.drawImage(this.mask,0,0,W,H);f.restore();let alpha=1;if(this.finishAt!==null){let u=clamp((this.time-this.finishAt)/.42,0,1);alpha=(1-u)*(1-u)}c.save();c.globalAlpha=alpha;c.drawImage(this.film,0,0,W,H);c.restore()}
if(this.finishAt!==null&&!this.complete)drawDeparture(c,this);
for(const p of this.parts){c.save();c.translate(p.x,p.y);c.rotate(p.angle);c.globalAlpha=(1-p.age/p.life)*.95;if(this.id==='heart')heart(c,0,0,p.size*1.8,'#ffd4e8');else if(this.id==='like')star(c,0,0,p.size*1.4,'#b9e5ba');else if(this.id==='fire'){c.fillStyle=p.age<p.life*.4?'#ffd18a':'#d75d33';c.fillRect(-p.size*.25,-p.size,p.size*.5,p.size*2)}else if(this.id==='party'){c.fillStyle=['#f5b5a2','#d4eaba','#f8d365','#a9bff3'][((Math.floor(p.angle)%4)+4)%4];c.fillRect(-p.size,-p.size*.4,p.size*2,p.size*.8)}else{c.fillStyle=this.id==='poop'?'#a6825b':'#ead8c0';c.beginPath();c.moveTo(-p.size,-p.size);c.lineTo(p.size,-p.size*.5);c.lineTo(p.size*.5,p.size);c.closePath();c.fill()}c.restore()}
if(this.demo&&this.finishAt===null){c.save();c.strokeStyle='#ffffffaa';c.fillStyle='#ffffff19';c.lineWidth=1.4;c.beginPath();c.arc(this.p.x,this.p.y,16,0,TAU);c.fill();c.stroke();c.restore()}}
snapshot(){return {id:this.id,progress:this.progress,complete:this.complete,particles:this.parts.length,hearts:this.hearts.map(h=>({x:h.x,y:h.y,dead:h.dead})),finite:this.hearts.every(h=>[h.x,h.y,h.vx,h.vy].every(Number.isFinite))&&this.parts.every(p=>[p.x,p.y,p.vx,p.vy].every(Number.isFinite)),time:this.time}}}

const covers=themes.map(t=>new Cover(t)),cover=covers[0];document.getElementById('grid').appendChild(cover.element);
function setMode(v){mode=v;for(const [id,m]of [['play-mode','play'],['erase-mode','erase']])document.getElementById(id).setAttribute('aria-pressed',String(v===m));cover.p.down=false;cover.previous=null;cover.pointerID=null;cover.element.querySelector('.hint span').textContent=v==='play'?'Коснитесь и потяните':'Потрите, чтобы открыть'}
document.getElementById('play-mode').onclick=()=>{if(cover.complete)cover.reset();setMode('play')};document.getElementById('erase-mode').onclick=()=>setMode('erase');document.getElementById('demo').innerHTML=playSVG+'Показать стирание';document.getElementById('demo').onclick=()=>cover.startDemo();document.getElementById('reset').innerHTML=resetSVG;document.getElementById('reset').onclick=()=>cover.reset();
let last=0;function frame(t){requestAnimationFrame(frame);const dt=clamp(last?(t-last)/1000:1/60,0,.04);last=t;if(document.hidden)return;const wasComplete=cover.complete;cover.update(dt);if(!cover.complete||!wasComplete)cover.render()}requestAnimationFrame(frame);
document.getElementById('photo-button').onclick=()=>document.getElementById('photo').click();document.getElementById('photo').onchange=e=>{const file=e.target.files?.[0];if(!file)return;const url=URL.createObjectURL(file),image=new Image();image.onload=()=>{photo=image;URL.revokeObjectURL(url);cover.reset()};image.onerror=()=>{URL.revokeObjectURL(url);document.querySelector('.top p').textContent='Не удалось открыть изображение. Попробуйте JPEG или PNG.'};image.src=url};
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{reduced=e.matches});document.addEventListener('visibilitychange',()=>{last=0;cover.p.down=false;cover.p.inside=false;cover.previous=null;cover.pointerID=null});
window.coverCollection=Object.freeze({setMode,snapshot:()=>covers.map(c=>c.snapshot()),hasPhoto:()=>!!photo,demo:()=>cover.startDemo(),reset:()=>cover.reset(),image:()=>cover.canvas.toDataURL('image/png'),setVisible:()=>{},setReduced:v=>{reduced=!!v},setPaused:v=>{paused=!!v},render:()=>cover.render()});
window.addEventListener('error',e=>{const p=document.querySelector('.top p');p.textContent='Ошибка: '+e.message;p.classList.add('error')});
})();</script></body></html>
